[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-gui"
version = "0.1.0"
description = "Giao diện điều khiển và phối hợp Agent (Antigravity · Codex · Claude Code) cho mọi dự án."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
agent-gui = "automation.review_loop.__main__:main"

[tool.setuptools.packages.find]
include = ["automation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
